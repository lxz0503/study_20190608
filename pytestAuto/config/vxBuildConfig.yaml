# SFTP_HIGHNUM for TSR V7SEC-1066
SFTP_HIGHNUM:
    vsb:
        layer : [ IPNET_SSH, ]
    vip:
        component : [ DISK_UTIL, DISK_UTIL_SHELL_CMD, RAM_DISK, ROMFS, SHELL, 
                      IFCONFIG, IPCOM_USE_RAM_DISK, 
                      SSH, IPD_CMD, IPCOM_SYSLOG_CMD, IPCOM_SYSVAR_CMD, IPCOM_KEY_DB_CMD, ]
        vxparam : [ SEC_VAULT_KEY_ENCRYPTING_PW='"testefefqf3fefgg"', ]
