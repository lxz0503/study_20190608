 # vxBuild.py config file

RTNET:
    vsb:
        layer : [RTNET, ]      # xiaozhan,this is an array
        layer_remove : []
        vxmake : []             # vxprj vsb config -s -add _WRS_CONFIG_COMPONENT_%s=y
        extra_build_cflags : [-DRTNET_SOCKTEST,]
    vip:
        component : [ROMFS, RTNET, RTNET_DEMO, RTNET_FIB_SHOW, RTNET_IPV4_SUPPORT, RTNET_IPV6_SUPPORT, RTNET_IP_SHOW, RTNET_LINK_SHOW, RTNET_LINK_SHOW, RTNET_MUX, RTNET_NEIGH_SHOW, RTNET_PING, RTNET_SOCK_SHOW, SHELL, SHELL_INTERP_CMD, STANDALONE_DTB]
        component_remove : [IPNET,]
        vx_extra_define : []    # vxprj buildmacro set EXTRA_DEFINE %s
        vxparam : []            # [RTNET_JSON_FILE='"/romfs/conf.json"',]
        add_file : [net/rtnet/test/socktest/tmain.c, net/rtnet/test/sock6test/tmain6.c]
        romfs_file :     # xiaozhan,below is an array, or you can use []
            - net/rtnet/test/rtnet/test/conf.json
            - net/rtnet/test/rtnet/test/25002.json
            - net/rtnet/test/rtnet/test/25003.json
            - net/rtnet/test/rtnet/test/28525.json
            - net/rtnet/test/rtnet/test/28526.json
            
RTNET_VXTEST_AF_PACKET:
    vsb:
        layer : [RTNET, VXTEST_BUILD]
    vip:
        component : [TM_RTNET_AF_PACKET_SOCK_TEST, ROMFS, RTNET_IPV6_SUPPORT, RTNET, SHELL, RTNET_LINK_SHOW, RTNET_MUX, RTNET_LINK_SHOW, RTNET_NEIGH_SHOW, RTNET_PING, RTNET_FIB_SHOW, RTNET_SOCK_SHOW, 
RTNET_IP_SHOW, RTNET_DEMO]
        vxparam : [RTNET_JSON_FILE='"/romfs/gei_28514.json"',]
        romfs_file : 
            - /workspace/lchen3/wassp/wassp_testcases/networking/RTNET_AF_PACKET_F10296/RT_AF_PACKET_DGRAM/gei_28514.json

            
